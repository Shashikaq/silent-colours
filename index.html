<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silent Colours – Art Gallery</title>
<meta name="description" content="Original art by Silent Colours.">
<meta property="og:title" content="Silent Colours – Art Gallery">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#0A0A0A;--panel:#131313;--ink:#EDE8DE;--muted:#8F8A80;--gold:#C9A961;--line:#2A2823;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.7 Jost,system-ui,sans-serif;overflow-x:hidden}
body.edit{padding-bottom:4.5rem}
h1,h2,h3,p,figure{margin:0}
a{color:inherit}
[data-k]{white-space:pre-line}
body.edit [data-k]{outline:1px dashed rgba(201,169,97,.55);outline-offset:3px;cursor:text}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400}
.wrap{max-width:70rem;margin:0 auto;padding:0 1.25rem}
.sec{padding:clamp(3rem,8vw,5.5rem) 0}
.sh{font-size:clamp(1.6rem,5vw,2.3rem);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding-bottom:1rem;border-bottom:1px solid var(--line);margin-bottom:1.5rem}
.b{display:inline-block;padding:.85rem 1.3rem;font:500 12px/1 Jost,sans-serif;letter-spacing:.05em;border:1px solid var(--gold);color:var(--ink);background:none;text-decoration:none;cursor:pointer;white-space:nowrap}
.b.f{background:var(--gold);color:#111}

/* header */
#hd{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1.25rem;background:linear-gradient(#000c,transparent)}
.brand,#mb{position:relative;z-index:26}
.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none}
#mb{background:none;border:0;color:var(--ink);font-size:1.6rem;line-height:1;cursor:pointer}
#menu{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;justify-content:center;align-items:center;gap:1.6rem;background:#0A0A0AF2;font-size:1.3rem}
body.menu #menu{display:flex}
#menu a{text-decoration:none;color:var(--muted);letter-spacing:.06em}
#menu a:hover{color:var(--ink)}
@media(min-width:860px){#mb{display:none}#menu,body.menu #menu{position:static;display:flex;flex-direction:row;background:none;gap:1.8rem;font-size:12px}}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:6rem 1.25rem 5rem;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;background-image:radial-gradient(ellipse 60% 70% at 25% 40%,#3a3022,transparent 70%)}
.hero .bg.i{opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 10%,#0A0A0Acc 85%),linear-gradient(transparent 65%,var(--bg))}
.hero .in{position:relative;z-index:1;width:100%;max-width:34rem;margin-left:auto}
@media(min-width:860px){.hero .in{margin-right:6vw}}
.hero h1{font-size:clamp(2.7rem,9vw,4.8rem);line-height:1.05;margin-bottom:1rem}
.tags{color:var(--muted);font-size:13px;margin-bottom:1.6rem}
.bt{display:flex;gap:.7rem;flex-wrap:wrap}
.sc{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:1;font-size:11px;color:var(--muted)}

/* about */
.ab{display:grid;gap:2rem;align-items:center}
@media(min-width:800px){.ab{grid-template-columns:1fr 1fr;gap:4rem}}
.pic{aspect-ratio:4/5;background-size:cover;background-position:center;background-image:radial-gradient(circle at 60% 30%,rgba(255,255,255,.25),transparent 45%),linear-gradient(160deg,#6c6c6c,#1b1b1b)}
.kick{color:var(--gold);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.8rem}
.ab h2{font-size:clamp(1.9rem,5vw,2.6rem);text-transform:uppercase;line-height:1.1;margin-bottom:1rem}
.ab p.tx{color:var(--muted);max-width:30rem}
.st{display:flex;margin-top:2rem}
.st>div{padding:0 1.2rem;border-left:1px solid var(--line)}
.st>div:first-child{padding-left:0;border:0}
.st b{display:block;font-weight:300;font-size:1.6rem;line-height:1.2}
.st span{font-size:12px;color:var(--muted)}

/* gallery */
.g{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:10.5rem;grid-auto-flow:dense;gap:.5rem}
@media(min-width:800px){.g{grid-template-columns:repeat(4,1fr);grid-auto-rows:13rem}}
.t{position:relative;overflow:hidden;cursor:pointer;background:var(--panel);clip-path:inset(100% 0 0 0);transition:clip-path 1.1s cubic-bezier(.2,.7,.1,1) calc(var(--d,0)*90ms)}
.t.in{clip-path:inset(0)}
.t img,.t .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.35);transition:transform 1.7s cubic-bezier(.2,.7,.1,1) calc(var(--d,0)*90ms)}
.t.in img,.t.in .ph{transform:scale(1)}
.t.in:hover img,.t.in:hover .ph{transform:scale(1.07);transition:transform .8s}
.t figcaption{position:absolute;left:0;right:0;bottom:0;padding:2rem .8rem .7rem;background:linear-gradient(transparent,#000b);font:italic 400 1.1rem "Cormorant Garamond",Georgia,serif;transform:translateY(.4rem);transition:transform .5s}
.t:hover figcaption{transform:none;color:var(--gold)}
.s0{grid-column:span 2;grid-row:span 2}.s2{grid-row:span 2}.s4{grid-column:span 2}
.ph{background-image:radial-gradient(circle at 65% 30%,rgba(255,255,255,.28),transparent 45%),linear-gradient(160deg,var(--a),var(--b))}
.tb{position:absolute;top:.4rem;right:.4rem;display:none;gap:.3rem;z-index:3}
body.edit .tb{display:flex}
.tb button{width:2rem;height:2rem;border-radius:50%;border:1px solid var(--gold);background:#000c;color:var(--gold);font-size:13px;cursor:pointer}

/* steps, reviews, footer */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:1.6rem;text-align:center}
.steps .c{width:4.4rem;height:4.4rem;border:1px solid var(--gold);border-radius:50%;margin:0 auto .9rem;display:grid;place-items:center;color:var(--gold);font-size:1.7rem}
.steps h3{color:var(--gold);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:400;margin-bottom:.4rem}
.steps p{color:var(--muted);font-size:12.5px}
.rv{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
.rv article{border:1px solid var(--line);padding:1.2rem;display:flex;flex-direction:column;gap:.6rem}
.rv .q{color:var(--gold);letter-spacing:.15em;font-size:13px}
.rv p{font-size:13px}
.rv small{color:var(--muted);align-self:flex-end}
footer{background:#151515;border-top:1px solid var(--line);padding:2rem 0 2.5rem;font-size:13px}
.ft{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr))}
.ft a,.ft span{display:block;text-decoration:none;color:var(--muted)}
.ft a:hover{color:var(--ink)}
.ft .h{color:var(--gold)}
.cp{color:var(--muted);font-size:12px;margin-top:1.5rem}

/* lightbox */
#lb{position:fixed;inset:0;z-index:60;background:#050505;display:flex;flex-direction:column;visibility:hidden;clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .75s cubic-bezier(.7,0,.2,1),visibility 0s .75s}
#lb.o{visibility:visible;clip-path:circle(150% at var(--x,50%) var(--y,50%));transition:clip-path .85s cubic-bezier(.7,0,.2,1),visibility 0s}
#lb .x{position:absolute;top:.8rem;right:1rem;z-index:2;background:none;border:0;color:var(--ink);font-size:1.4rem;cursor:pointer}
.li{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:3.5rem 1rem 1rem}
.li img{max-width:100%;max-height:100%;object-fit:contain}
.li .ph{width:min(86vw,60vh);aspect-ratio:4/5}
.lt{padding:1rem 1.4rem 1.6rem;max-width:34rem;margin:0 auto;width:100%}
.lt .n{color:var(--gold);font-size:12px;letter-spacing:.1em}
.lt h3{font-size:2.1rem;margin:.2rem 0 .6rem}
.lt p.d{white-space:pre-line;color:var(--muted)}
.ln{display:flex;gap:.6rem;margin-top:1rem}
.ln button{width:2.6rem;height:2.6rem;background:none;border:1px solid var(--line);color:var(--ink);font-size:1.1rem;cursor:pointer}
@media(min-width:900px){#lb{flex-direction:row;align-items:center}.li{height:100%}.lt{flex:0 0 24rem;margin:0;padding:2rem}}

/* edit bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;gap:.5rem;padding:.6rem .75rem calc(.6rem + env(safe-area-inset-bottom,0px));background:#000e;border-top:1px solid var(--gold);overflow-x:auto}
body.edit #bar{display:flex}

@media(prefers-reduced-motion:no-preference){
  .hero .in>*{animation:up 1.1s both}
  .hero .in>*:nth-child(2){animation-delay:.15s}.hero .in>*:nth-child(3){animation-delay:.3s}
}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.t{clip-path:none;transition:none}.t img,.t .ph{transform:none;transition:none}#lb,#lb.o{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="lb" role="dialog" aria-modal="true"></div>
<div id="bar"></div>
<script type="application/json" id="content">{"brand":"Silent Colours","heroTitle":"Where Silence\nFinds Its Colour","heroTags":"Original Art • Commissions • Collaborations","btn1":"View my work","btn2":"Contact me","aboutKick":"About me","aboutTitle":"Hello, I’m\nYour Name","aboutText":"I make art that feels calm and slow, built from soft colour and simple shapes. Each piece starts with a mood rather than a plan.","stats":[{"n":"00+","l":"artworks"},{"n":"00+","l":"commissions"},{"n":"0+","l":"years of art"}],"heroImg":"","aboutImg":"","galTitle":"Portfolio","photos":[{"s":"","t":"Quiet Harbour","d":"The boats stopped moving a long time ago.\nNobody remembers who tied them."},{"s":"","t":"Late Monsoon","d":"The rain has not stopped for three days.\nSomething is walking in it, very slowly."},{"s":"","t":"Soft Embers","d":"The fire went out hours ago.\nThe warmth in the room is still there."},{"s":"","t":"Low Tide","d":"The sea went out and left things behind.\nThey are not all shells."},{"s":"","t":"Evening Lilac","d":"At this hour the garden is quiet.\nToo quiet to be empty."},{"s":"","t":"Salt and Slate","d":"A grey room by the sea.\nOne chair is always warm."},{"s":"","t":"Paper Moon","d":"The moon looks different tonight.\nIt is closer than it should be."}],"stepsTitle":"How it works","steps":[{"t":"Say hello","d":"Tell me your idea and what you have in mind."},{"t":"Mood and plan","d":"We choose the colours, size and feeling."},{"t":"Creation","d":"I create your piece with care."},{"t":"Finishing","d":"Final touches and a quick check with you."},{"t":"Delivery","d":"Your artwork reaches you, ready to enjoy."}],"revTitle":"Kind words","reviews":[{"t":"Add what a client says about your work here.","n":"Client name"},{"t":"Add what a client says about your work here.","n":"Client name"},{"t":"Add what a client says about your work here.","n":"Client name"}],"email":"hello@example.com","phone":"+94 00 000 0000","city":"Your city, Sri Lanka","fb":"https://www.facebook.com/silentcolours.art","copy":"© 2026 Silent Colours. All artwork belongs to the artist."}</script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var C=JSON.parse($('#content').textContent),EDIT=/[?&]edit(=|&|$)/.test(location.search),KEY='silent-colours-v1';
if(EDIT){try{var sv=localStorage.getItem(KEY);if(sv)C=JSON.parse(sv)}catch(e){}}
var GR=[['#7d7d7d','#282828'],['#a39d92','#37342e'],['#5d5d5d','#191919'],['#8e887c','#2b2824'],['#707070','#212121'],['#9c9c9c','#383838'],['#85807a','#262420']];
var LB=$('#lb'),CUR=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function get(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},C)}
function set(p,v){var a=p.split('.'),l=a.pop(),o=a.reduce(function(o,k){return o[k]},C);o[l]=v}
function k(p){return ' data-k="'+p+'">'+esc(get(p))}
function S(){if(EDIT)try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){alert('Browser storage is full. Tap Download site file now to keep your work.')}}
function bg(u){return u?' style="background-image:url(&quot;'+esc(u)+'&quot;)"':''}
function ph(i){return '<div class="ph" style="--a:'+GR[i%7][0]+';--b:'+GR[i%7][1]+'"></div>'}
function tile(p,i){
  return '<figure class="t s'+(i%7)+'" style="--d:'+(i%7)+'" data-i="'+i+'">'+(p.s?'<img src="'+esc(p.s)+'" alt="'+esc(p.t)+'" loading="lazy">':ph(i))+
  '<figcaption>'+esc(p.t)+'</figcaption><div class="tb"><button data-a="ed" aria-label="Edit caption">✎</button><button data-a="rm" aria-label="Remove photo">✕</button></div></figure>';
}
function R(){
  var P=C.photos,first=P.filter(function(p){return p.s})[0],hi=C.heroImg||(first&&first.s),fb=/^https?:\/\//i.test(C.fb||'')?C.fb:'';
  var nav=[['about','About'],['gallery','Portfolio'],['steps','Steps'],['reviews','Reviews'],['contact','Contact']];
  $('#app').innerHTML=
  '<header id="hd"><a class="brand" href="#top"'+k('brand')+'</a><nav id="menu">'+nav.map(function(n){return '<a href="#'+n[0]+'">'+n[1]+'</a>'}).join('')+'</nav><button id="mb" aria-label="Menu">☰</button></header>'+
  '<section class="hero" id="top"><div class="bg'+(hi?' i':'')+'"'+bg(hi)+'></div><div class="in"><h1 class="serif"'+k('heroTitle')+'</h1><p class="tags"'+k('heroTags')+'</p><div class="bt"><a class="b f" href="#gallery"'+k('btn1')+'</a><a class="b" href="#contact"'+k('btn2')+'</a></div></div><span class="sc">Scroll down ↓</span></section>'+
  '<section class="sec" id="about"><div class="wrap ab"><div class="pic"'+bg(C.aboutImg)+'></div><div><p class="kick"'+k('aboutKick')+'</p><h2 class="serif"'+k('aboutTitle')+'</h2><p class="tx"'+k('aboutText')+'</p><div class="st">'+
    C.stats.map(function(s,i){return '<div><b'+k('stats.'+i+'.n')+'</b><span'+k('stats.'+i+'.l')+'</span></div>'}).join('')+'</div></div></div></section>'+
  '<section class="sec" id="gallery"><div class="wrap"><h2 class="sh serif"'+k('galTitle')+'</h2><div class="g">'+P.map(tile).join('')+'</div></div></section>'+
  '<section class="sec" id="steps"><div class="wrap"><h2 class="sh serif"'+k('stepsTitle')+'</h2><div class="steps">'+
    C.steps.map(function(s,i){return '<div><div class="c serif">'+(i+1)+'</div><h3'+k('steps.'+i+'.t')+'</h3><p'+k('steps.'+i+'.d')+'</p></div>'}).join('')+'</div></div></section>'+
  '<section class="sec" id="reviews"><div class="wrap"><h2 class="sh serif"'+k('revTitle')+'</h2><div class="rv">'+
    C.reviews.map(function(r,i){return '<article><span class="q">★★★★★</span><p'+k('reviews.'+i+'.t')+'</p><small'+k('reviews.'+i+'.n')+'</small></article>'}).join('')+'</div></div></section>'+
  '<footer id="contact"><div class="wrap"><div class="ft"><div><a href="#about">About</a><a href="#gallery">Portfolio</a><a href="#steps">Steps</a><a href="#reviews">Reviews</a></div>'+
    '<div><span class="h">Contact</span><a href="mailto:'+esc(C.email)+'"'+k('email')+'</a><a href="tel:'+esc(String(C.phone).replace(/\s/g,''))+'"'+k('phone')+'</a><span'+k('city')+'</span></div>'+
    '<div>'+(fb?'<a href="'+esc(fb)+'" target="_blank" rel="noopener">Facebook</a>':'')+'</div></div><p class="cp"'+k('copy')+'</p></div></footer>';
  var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15}):null;
  document.querySelectorAll('.t').forEach(function(t){io?io.observe(t):t.classList.add('in')});
  if(EDIT)document.querySelectorAll('[data-k]').forEach(function(e){e.contentEditable='true'});
}
function lb(i){
  var n=C.photos.length;CUR=(i+n)%n;var p=C.photos[CUR];
  LB.innerHTML='<button class="x" aria-label="Close">✕</button><div class="li">'+(p.s?'<img src="'+esc(p.s)+'" alt="'+esc(p.t)+'">':ph(CUR))+'</div>'+
  '<div class="lt"><p class="n">'+(CUR+1)+' / '+n+'</p><h3 class="serif">'+esc(p.t)+'</h3><p class="d">'+esc(p.d)+'</p><div class="ln"><button data-n="-1" aria-label="Previous">←</button><button data-n="1" aria-label="Next">→</button></div></div>';
}
function openLB(i,x,y){
  if(!C.photos.length)return;
  LB.style.setProperty('--x',x+'px');LB.style.setProperty('--y',y+'px');lb(i);void LB.offsetWidth;
  LB.classList.add('o');document.body.style.overflow='hidden';
}
function closeLB(){LB.classList.remove('o');document.body.style.overflow=''}
LB.addEventListener('click',function(e){
  var n=e.target.closest('[data-n]');
  if(n){lb(CUR+(+n.dataset.n));return}
  if(e.target.closest('.x'))closeLB();
});
document.addEventListener('keydown',function(e){
  if(!LB.classList.contains('o'))return;
  if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')lb(CUR+1);if(e.key==='ArrowLeft')lb(CUR-1);
});
var app=$('#app');
app.addEventListener('click',function(e){
  if(EDIT&&e.target.closest('a[data-k],a[href^="mailto"],a[href^="tel"]')){e.preventDefault();return}
  if(e.target.closest('#mb')){document.body.classList.toggle('menu');return}
  if(e.target.closest('#menu a')){document.body.classList.remove('menu');return}
  var t=e.target.closest('.t');if(!t)return;
  var i=+t.dataset.i,b=e.target.closest('[data-a]');
  if(b){
    if(b.dataset.a==='rm'){if(confirm('Remove this photo?')){C.photos.splice(i,1);S();R()}}
    else{
      var p=C.photos[i],ti=prompt('Photo title',p.t);if(ti===null)return;
      var de=prompt('Description (shown on the photo page)',p.d);
      p.t=ti;if(de!==null)p.d=de;S();R();
    }
    return;
  }
  openLB(i,e.clientX,e.clientY);
});
app.addEventListener('input',function(e){
  var p=e.target.dataset&&e.target.dataset.k;
  if(p){set(p,e.target.innerText.replace(/\n$/,''));S()}
});
R();

/* ---------- edit mode: open this site with ?edit at the end of the address ---------- */
function pick(multi,cb){
  var i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=multi;
  i.onchange=function(){if(i.files.length)cb([].slice.call(i.files))};i.click();
}
function shrink(f,max){
  return new Promise(function(ok){
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82));
    };im.src=r.result};
    r.readAsDataURL(f);
  });
}
var A={
  add:function(){pick(true,function(fs){Promise.all(fs.map(function(f){return shrink(f,1600)})).then(function(u){u.forEach(function(s){C.photos.push({s:s,t:'Untitled',d:''})});S();R()})})},
  hero:function(){pick(false,function(fs){shrink(fs[0],1800).then(function(u){C.heroImg=u;S();R()})})},
  about:function(){pick(false,function(fs){shrink(fs[0],1200).then(function(u){C.aboutImg=u;S();R()})})},
  fb:function(){var v=prompt('Facebook page link',C.fb);if(v!==null){C.fb=v.trim();S();R()}},
  dl:function(){
    fetch(location.href.split(/[?#]/)[0],{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){
      var j=JSON.stringify(C).replace(/</g,'\\u003c');
      var o=h.replace(/(<script type="application\/json" id="content">)[\s\S]*?(<\/script>)/,function(_,a,b){return a+j+b});
      var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([o],{type:'text/html'}));l.download='index.html';l.click();
      alert('Done! Now upload this index.html file to your GitHub repository to replace the old one.');
    }).catch(function(){alert('Could not read the page. Open your site from its GitHub link and try again.')});
  },
  reset:function(){if(confirm('Remove all your unsaved changes?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}},
  exit:function(){location.href=location.pathname}
};
if(EDIT){
  document.body.classList.add('edit');
  var bar=$('#bar');
  bar.innerHTML='<button class="b f" data-b="add">+ Add photos</button><button class="b" data-b="hero">Hero photo</button><button class="b" data-b="about">About photo</button><button class="b" data-b="fb">Facebook link</button><button class="b f" data-b="dl">Download site file</button><button class="b" data-b="reset">Reset</button><button class="b" data-b="exit">Exit</button>';
  bar.addEventListener('click',function(e){var b=e.target.closest('[data-b]');if(b)A[b.dataset.b]()});
}
})();
</script>
</body>
</html>
